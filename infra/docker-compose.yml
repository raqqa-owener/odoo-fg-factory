name: odoo-fg-factory

services:
  fg-postgres:
    image: postgres:16
    container_name: fg-factory-postgres
    environment:
      POSTGRES_DB: ${FG_POSTGRES_DB:-fg_factory}
      POSTGRES_USER: ${FG_POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${FG_POSTGRES_PASSWORD:-dev}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_POSTGRES_PORT:-15532}:5432"
    volumes:
      - fg_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FG_POSTGRES_USER:-dev} -d ${FG_POSTGRES_DB:-fg_factory}"]
      interval: 10s
      timeout: 5s
      retries: 10

  fg-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: fg-factory-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${FG_DATABASE_URL:-postgresql+psycopg2://dev:dev@fg-postgres:5432/fg_factory}
      STORAGE_ROOT: /app/storage
      ARTIFACT_ROOT: /app/artifacts
      GENERATED_ADDONS_ROOT: /app/generated-addons
      CUSTOM_ADDONS_ROOT: /app/custom_addons
      NEO4J_URI: ${NEO4J_URI:-bolt://fg-neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_APPLY_ENABLED: ${NEO4J_APPLY_ENABLED:-false}
      CORS_ORIGINS: http://localhost:${FG_CONSOLE_PORT:-5179},http://127.0.0.1:${FG_CONSOLE_PORT:-5179}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_API_PORT:-18181}:8000"
    volumes:
      - ../api:/app
      - ../artifacts:/app/artifacts
      - ../storage:/app/storage
      - ../generated-addons:/app/generated-addons
      - ../custom_addons:/app/custom_addons
    depends_on:
      fg-postgres:
        condition: service_healthy
      fg-neo4j:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  fg-console:
    image: node:20-bookworm-slim
    container_name: fg-factory-console
    working_dir: /app
    env_file:
      - ../.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_USE_YFILES_CANVAS: ${VITE_USE_YFILES_CANVAS:-false}
      CHOKIDAR_USEPOLLING: "true"
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_CONSOLE_PORT:-5179}:5179"
    volumes:
      - ../console:/app
      - fg_console_node_modules:/app/node_modules
    depends_on:
      - fg-api
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5179"

  fg-neo4j:
    image: neo4j:5.20-community
    container_name: fg-factory-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_server_bolt_advertised__address: ${NEO4J_BOLT_ADVERTISED_ADDRESS:-127.0.0.1:18687}
      NEO4J_server_http_advertised__address: ${NEO4J_HTTP_ADVERTISED_ADDRESS:-127.0.0.1:18474}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_NEO4J_HTTP_PORT:-18474}:7474"
      - "${FG_NEO4J_BOLT_PORT:-18687}:7687"
    volumes:
      - fg_neo4j_data:/data
      - fg_neo4j_logs:/logs

  fg-odoo-db:
    image: postgres:16
    container_name: fg-factory-odoo-db
    environment:
      POSTGRES_DB: ${FG_ODOO_DB_NAME:-odoo_fg_demo}
      POSTGRES_USER: ${FG_ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${FG_ODOO_DB_PASSWORD:-odoo}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "15632:5432"
    volumes:
      - fg_odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FG_ODOO_DB_USER:-odoo} -d ${FG_ODOO_DB_NAME:-odoo_fg_demo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  fg-odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    container_name: fg-factory-odoo
    depends_on:
      fg-odoo-db:
        condition: service_healthy
    environment:
      HOST: ${FG_ODOO_DB_HOST:-fg-odoo-db}
      PORT: ${FG_ODOO_DB_PORT:-5432}
      USER: ${FG_ODOO_DB_USER:-odoo}
      PASSWORD: ${FG_ODOO_DB_PASSWORD:-odoo}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_ODOO_PORT:-18069}:8069"
      - "${FG_ODOO_LONGPOLLING_PORT:-18072}:8072"
    volumes:
      - fg_odoo_data:/var/lib/odoo
      - ../custom_addons:/mnt/extra-addons
      - ../odoo_data/odoo.conf:/etc/odoo/odoo.conf:ro
    command: odoo -c /etc/odoo/odoo.conf

  fg-pgadmin:
    image: dpage/pgadmin4:8
    container_name: fg-factory-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${FG_PGADMIN_PORT:-15180}:80"
    depends_on:
      - fg-postgres
      - fg-odoo-db
    volumes:
      - fg_pgadmin_data:/var/lib/pgadmin

volumes:
  fg_postgres_data:
  fg_console_node_modules:
  fg_neo4j_data:
  fg_neo4j_logs:
  fg_odoo_db_data:
  fg_odoo_data:
  fg_pgadmin_data:
